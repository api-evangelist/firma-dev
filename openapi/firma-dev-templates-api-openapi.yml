openapi: 3.2.0
info:
  title: Firma Partner Templates API
  description: RESTful API for document signing and template management.
  version: 01.38.00
  contact:
    name: API Support
    url: https://firma.com/support
servers:
- url: https://api.firma.dev/functions/v1/signing-request-api
  description: Production API - Recommended (Current)
- url: https://api.firma.dev/api/v1
  description: Production API - Planned
security:
- ApiKeyAuth: []
tags:
- name: Templates
  description: Template management operations
paths:
  /templates:
    get:
      summary: List Templates
      description: Retrieve a paginated list of templates
      tags:
      - Templates
      security:
      - ApiKeyAuth: []
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
        description: Page number
      - name: page_size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
        description: Items per page
      - name: name
        in: query
        schema:
          type: string
        description: Filter by template name (partial match, case-insensitive)
      - name: created_after
        in: query
        schema:
          type: string
          format: date-time
        description: Filter templates created after this date (ISO 8601 format)
      - name: created_before
        in: query
        schema:
          type: string
          format: date-time
        description: Filter templates created before this date (ISO 8601 format)
      - name: sort_by
        in: query
        schema:
          type: string
          enum:
          - name
          - created_on
          - last_changed_on
          default: created_on
        description: Field to sort by
      - name: sort_order
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
        description: Sort order
      responses:
        '200':
          description: Templates retrieved successfully
          headers:
            X-RateLimit-Limit:
              schema:
                type: integer
              description: 'Rate limit: 200 requests per minute'
            X-RateLimit-Remaining:
              schema:
                type: integer
            X-RateLimit-Reset:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitError'
      operationId: listTemplates
      x-codeSamples:
      - lang: TypeScript
        label: '@firma-dev/sdk'
        source: 'import { FirmaClient } from "@firma-dev/sdk";


          const firma = new FirmaClient({ apiKey: "YOUR_API_KEY" });


          const response = await firma.templates.listTemplates();

          console.log(response);'
    post:
      summary: Create Template
      description: Create a new template with a base64-encoded PDF document. The API automatically extracts the page count from the document.
      tags:
      - Templates
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - document
              properties:
                name:
                  type: string
                  maxLength: 255
                  description: Template name
                  example: Employment Contract Template
                description:
                  type: string
                  description: Template description
                  example: Standard employment contract for new hires
                document:
                  type: string
                  format: byte
                  description: Base64-encoded PDF or DOCX document. DOCX files are automatically converted to PDF. The API will automatically extract the page count from the document. For documents larger than 5 MB, use POST /documents and pass the document_id instead. (mutually exclusive with document_id)
                  example: JVBERi0xLjQKJeLjz9MKMyAwIG9iago8PC9UeXBlIC9QYWdlCi9QYXJlbnQgMSAwIFIKL1Jlc291c...
                expiration_hours:
                  type: integer
                  description: Hours until signing request expires
                  default: 168
                  example: 168
                settings:
                  type: object
                  properties:
                    allow_editing_before_sending:
                      type: boolean
                      default: false
                      description: Allow editing fields before sending
                    attach_pdf_on_finish:
                      type: boolean
                      default: true
                      description: Attach completed PDF to completion email
                    allow_download:
                      type: boolean
                      default: true
                      description: Allow recipients to download the document
                    hand_drawn_only:
                      type: boolean
                      default: false
                      description: Require signers to hand-draw their signatures instead of using typed signatures
                    require_otp_verification:
                      type:
                      - boolean
                      - 'null'
                      default: null
                      description: Require signers to verify their email with a one-time code. null = inherit from workspace/company.
                    disable_guided_navigation:
                      type:
                      - boolean
                      - 'null'
                      description: Disable automatic scrolling to the next required field during signing. Inherits from workspace or company if not set.
                    allow_presigning_download:
                      type:
                      - boolean
                      - 'null'
                      description: Allow signers to download the original document before signing. Inherits from workspace or company setting when null.
                    show_qr_code:
                      type:
                      - boolean
                      - 'null'
                      description: Show a QR code on the signing page that lets signers continue on their phone. Inherits from workspace or company setting when null.
                document_id:
                  type: string
                  format: uuid
                  description: ID of a previously uploaded document (mutually exclusive with document). Obtain by calling POST /documents first.
                  example: 123e4567-e89b-12d3-a456-426614174000
      responses:
        '201':
          description: Template created successfully
          headers:
            X-RateLimit-Limit:
              schema:
                type: integer
              description: 'Rate limit: 120 requests per minute'
            X-RateLimit-Remaining:
              schema:
                type: integer
            X-RateLimit-Reset:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitError'
      operationId: createTemplate
      x-codeSamples:
      - lang: TypeScript
        label: '@firma-dev/sdk'
        source: "import { FirmaClient } from \"@firma-dev/sdk\";\n\nconst firma = new FirmaClient({ apiKey: \"YOUR_API_KEY\" });\n\nconst response = await firma.templates.createTemplate({\n    name: \"Employment Contract Template\",\n    document: \"JVBERi0xLjQKJeLjz9MKMyAwIG9iago8PC9UeXBlIC9QYWdlCi9QYXJlbnQgMSAwIFIKL1Jlc291c...\"\n});\nconsole.log(response);"
  /templates/{id}:
    get:
      summary: Get Template
      description: Retrieve a specific template by ID
      tags:
      - Templates
      security:
      - ApiKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Template retrieved successfully
          headers:
            X-RateLimit-Limit:
              schema:
                type: integer
              description: 'Rate limit: 200 requests per minute'
            X-RateLimit-Remaining:
              schema:
                type: integer
            X-RateLimit-Reset:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'
      operationId: getTemplate
      x-codeSamples:
      - lang: TypeScript
        label: '@firma-dev/sdk'
        source: "import { FirmaClient } from \"@firma-dev/sdk\";\n\nconst firma = new FirmaClient({ apiKey: \"YOUR_API_KEY\" });\n\nconst response = await firma.templates.getTemplate({\n    id: \"id\"\n});\nconsole.log(response);"
    patch:
      summary: Partially Update Template
      description: Update template properties, a single user, OR a single field. Cannot mix multiple entity types in one request. Use PUT for comprehensive updates including users, fields, and reminders.
      tags:
      - Templates
      security:
      - ApiKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                description: Update template properties
                properties:
                  name:
                    type: string
                    maxLength: 255
                    description: Template name
                  description:
                    type: string
                    description: Template description
                  document:
                    type: string
                    format: byte
                    description: Base64-encoded PDF or DOCX to replace document. DOCX files are automatically converted to PDF. For documents larger than 5 MB, use POST /documents and pass the document_id instead. (mutually exclusive with document_id)
                  document_id:
                    type: string
                    format: uuid
                    description: ID of a previously uploaded document (mutually exclusive with document). Obtain by calling POST /documents first.
                    example: 123e4567-e89b-12d3-a456-426614174000
                  expiration_hours:
                    type: integer
                    minimum: 1
                    description: Hours until expiration
                  settings:
                    type: object
                    properties:
                      allow_editing_before_sending:
                        type: boolean
                      attach_pdf_on_finish:
                        type: boolean
                      allow_download:
                        type: boolean
                      hand_drawn_only:
                        type: boolean
                      require_otp_verification:
                        type:
                        - boolean
                        - 'null'
                      disable_guided_navigation:
                        type:
                        - boolean
                        - 'null'
                      allow_presigning_download:
                        type:
                        - boolean
                        - 'null'
                        description: Allow signers to download the original document before signing. Inherits from workspace or company setting when null.
                      show_qr_code:
                        type:
                        - boolean
                        - 'null'
                        description: Show a QR code on the signing page that lets signers continue on their phone. Inherits from workspace or company setting when null.
              - type: object
                description: Update or create a single user
                required:
                - user
                properties:
                  user:
                    type: object
                    required:
                    - first_name
                    - email
                    - designation
                    - order
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Include to update existing user, omit to create new. An existing recipient cannot be changed between CC and Signer/Approver (400); delete it and create it again.
                      first_name:
                        type: string
                        maxLength: 255
                      last_name:
                        type: string
                        maxLength: 255
                        description: Optional, but required if using full_name or last_name prefilled variables
                      email:
                        type: string
                        format: email
                      designation:
                        type: string
                        enum:
                        - Signer
                        - Approver
                        - CC
                      order:
                        type: integer
                        minimum: 1
                      phone_number:
                        type: string
                      street_address:
                        type: string
                      city:
                        type: string
                      state_province:
                        type: string
                      postal_code:
                        type: string
                      country:
                        type: string
                      title:
                        type: string
                      company:
                        type: string
              - type: object
                description: Update or create a single field
                required:
                - field
                properties:
                  field:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Include to update existing field, omit to create new
                      type:
                        type: string
                        enum:
                        - text
                        - signature
                        - date
                        - checkbox
                        - initial
                        - initials
                        - dropdown
                        - radio_buttons
                        - textarea
                        - text_area
                        - url
                        - file
                        - stamp
                        - approval_signature
                        - approval_checkmark
                        - approval_date
                        description: Field type. Accepts 'initial' or 'initials', 'textarea' or 'text_area'. Required for new fields. url fields are automatically read-only. file fields allow signers to upload attachments (images/PDF). stamp fields display a pre-configured image.
                      x:
                        type: number
                        description: X position on document. Required for new fields.
                      y:
                        type: number
                        description: Y position on document. Required for new fields.
                      width:
                        type: number
                        description: Field width. Required for new fields.
                      height:
                        type: number
                        description: Field height. Required for new fields.
                      page:
                        type: integer
                        minimum: 1
                        description: Page number (1-indexed). Required for new fields.
                      required:
                        type: boolean
                        description: Whether field is required
                      assigned_to_user_id:
                        type:
                        - string
                        - 'null'
                        format: uuid
                        description: Template user ID to assign field to
                      variable_name:
                        type: string
                        description: Variable name for prefilled data mapping
                      variable_defined_name:
                        type:
                        - string
                        - 'null'
                        maxLength: 100
                        description: Human-readable custom field definition name. Can be used as an alternative to variable_name for targeting fields in template-based creation.
                      options:
                        type: array
                        items:
                          type: string
                        description: Options for dropdown fields
                      format_rules:
                        type: object
                        description: Format rules (e.g., date format, urlDisplayText for url fields, acceptedFileTypes for file fields)
                      multi_group_id:
                        type: string
                        format: uuid
                        description: Group ID for radio button groups
                      default_to_signing_date:
                        type: boolean
                        description: For date fields, use signing date as default
                      read_only:
                        type: boolean
                        description: Whether field is read-only (automatically true for url fields)
                      read_only_value:
                        type: string
                        description: Static value for read-only fields. For url fields, this is the URL to link to.
              - type: object
                required:
                - seal_participant
                description: Swap or assign a seal participant on a sent signing request. The seal_participant object identifies the participant slot and the target seal to apply.
                properties:
                  seal_participant:
                    type: object
                    required:
                    - participant_id
                    - swap_to_seal_id
                    description: Seal participant swap. Replaces the seal assigned to a participant slot with a different seal.
                    properties:
                      participant_id:
                        type: string
                        format: uuid
                        description: ID of the seal participant slot to update
                      swap_to_seal_id:
                        type: string
                        format: uuid
                        description: ID of the new organization seal to assign to the slot
            examples:
              update-properties:
                summary: Update properties
                value:
                  name: Updated Template Name
                  expiration_hours: 72
              create-url-field:
                summary: Create URL field
                value:
                  field:
                    type: url
                    x: 100
                    y: 200
                    width: 150
                    height: 30
                    page: 1
                    read_only_value: https://example.com/terms
                    format_rules:
                      urlDisplayText: View Terms & Conditions
              create-file-field:
                summary: Create file upload field
                value:
                  field:
                    type: file
                    x: 100
                    y: 300
                    width: 200
                    height: 40
                    page: 1
                    required: true
                    format_rules:
                      acceptedFileTypes: image_and_pdf
              update-field:
                summary: Update existing field
                value:
                  field:
                    id: field123-e89b-12d3-a456-426614174000
                    x: 120
                    y: 220
      responses:
        '200':
          description: Template partially updated successfully
          headers:
            X-RateLimit-Limit:
              schema:
                type: integer
              description: 'Rate limit: 120 requests per minute'
            X-RateLimit-Remaining:
              schema:
                type: integer
            X-RateLimit-Reset:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplatePatchResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Template or seal participant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_found:
                  value:
                    error: Template not found
                    code: NOT_FOUND
                seal_not_found:
                  value:
                    error: Organization seal not found or unavailable in this workspace
                    code: NOT_FOUND
        '429':
          $ref: '#/components/responses/RateLimitError'
      operationId: patchTemplate
      x-participant-order-contract:
        membership: Signer and Approver recipients plus organization seal participants share one contiguous 1-based order space. CC recipients use a separate sequence and never consume a participant position.
        patch: 'On an unsent template, order must be in [1..n] for a move and [1..n+1] for a create. A move is shift-insert: every participant between the old and new positions is renumbered. A create with omitted order appends. Explicit order 0 is invalid.'
        lockedStates: An applied participant on an aborted-send request can narrow the reachable interval; this template operation has no sent state.
        create: When no seal is present, tied recipient order values are resolved deterministically and compacted to [1..n]. A seal-bearing create rejects a non-contiguous space or collision with INVALID_SIGNING_ORDER. When use_signing_order is false, or any recipient omits order, participant orders follow array order.
        sideEffects: Retrying a create after a later field write fails creates a second participant, matching the existing non-idempotent create contract.
        errors:
        - INVALID_SIGNING_ORDER
        - PARTICIPANTS_CHANGED
      x-codeSamples:
      - lang: TypeScript
        label: '@firma-dev/sdk'
        source: "import { FirmaClient } from \"@firma-dev/sdk\";\n\nconst firma = new FirmaClient({ apiKey: \"YOUR_API_KEY\" });\n\nconst response = await firma.templates.patchTemplate({\n    id: \"id\",\n    body: {\n        name: \"Updated Template Name\",\n        expiration_hours: 72\n    }\n});\nconsole.log(response);"
    put:
      summary: Comprehensive Template Update
      description: Comprehensive update of template including properties, users, fields, and reminders. Supports user deletion with field reassignment or deletion. All sections are optional but at least one must be provided.
      tags:
      - Templates
      security:
      - ApiKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                template_properties:
                  type: object
                  description: Update template metadata and settings
                  properties:
                    name:
                      type: string
                      maxLength: 255
                    description:
                      type: string
                    document:
                      type: string
                      format: byte
                      description: Base64-encoded PDF or DOCX to replace document. DOCX files are automatically converted to PDF. For documents larger than 5 MB, use POST /documents and pass the document_id instead. (mutually exclusive with document_id)
                    document_id:
                      type: string
                      format: uuid
                      description: ID of a previously uploaded document (mutually exclusive with document). Obtain by calling POST /documents first.
                      example: 123e4567-e89b-12d3-a456-426614174000
                    expiration_hours:
                      type: integer
                      minimum: 1
                    settings:
                      type: object
                      properties:
                        allow_editing_before_sending:
                          type: boolean
                        attach_pdf_on_finish:
                          type: boolean
                        allow_download:
                          type: boolean
                        hand_drawn_only:
                          type: boolean
                        require_otp_verification:
                          type:
                          - boolean
                          - 'null'
                        disable_guided_navigation:
                          type:
                          - boolean
                          - 'null'
                        allow_presigning_download:
                          type:
                          - boolean
                          - 'null'
                          description: Allow signers to download the original document before signing. Inherits from workspace or company setting when null.
                        show_qr_code:
                          type:
                          - boolean
                          - 'null'
                          description: Show a QR code on the signing page that lets signers continue on their phone. Inherits from workspace or company setting when null.
                users:
                  type: array
                  description: Upsert users (include id to update, omit to create). An existing recipient cannot be changed between CC and Signer/Approver (400); delete it and create it again.
                  items:
                    type: object
                    required:
                    - first_name
                    - email
                    - designation
                    - order
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Omit for new users
                      first_name:
                        type: string
                      last_name:
                        type: string
                        description: Optional, but required if using full_name or last_name prefilled variables
                      email:
                        type: string
                        format: email
                      designation:
                        type: string
                        enum:
                        - Signer
                        - Approver
                        - CC
                      order:
                        type: integer
                        minimum: 1
                      phone_number:
                        type: string
                      street_address:
                        type: string
                      city:
                        type: string
                      state_province:
                        type: string
                      postal_code:
                        type: string
                      country:
                        type: string
                      title:
                        type: string
                      company:
                        type: string
                force_remove_conditions:
                  type: boolean
                  default: false
                  description: 'When deleting users whose fields are referenced by conditions in other fields: if true, automatically remove the condition references; if false (default), the request will be rejected with an error.'
                deleted_users:
                  type: array
                  description: Users to delete with field handling strategy
                  items:
                    type: object
                    required:
                    - user_id
                    - field_action
                    properties:
                      user_id:
                        type: string
                        format: uuid
                      field_action:
                        type: string
                        enum:
                        - delete
                        - reassign
                        description: What to do with fields assigned to this user
                      reassign_to_user_id:
                        type: string
                        format: uuid
                        description: Required when field_action is 'reassign'. Target user must have same designation.
                fields:
                  type: array
                  description: Upsert fields (include id to update, omit to create)
                  items:
                    type: object
                    required:
                    - type
                    - x
                    - y
                    - width
                    - height
                    - page
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Omit for new fields
                      type:
                        type: string
                        enum:
                        - signature
                        - text
                        - date
                        - checkbox
                        - dropdown
                        - approval_signature
                        - approval_checkmark
                        - approval_date
                      x:
                        type: number
                        minimum: 0
                        maximum: 100
                        description: X position as percentage
                      y:
                        type: number
                        minimum: 0
                        maximum: 100
                        description: Y position as percentage
                      width:
                        type: number
                        minimum: 0
                        maximum: 100
                      height:
                        type: number
                        minimum: 0
                        maximum: 100
                      page:
                        type: integer
                        minimum: 1
                      required:
                        type: boolean
                        default: false
                      assigned_to_user_id:
                        type: string
                        format: uuid
                      options:
                        type: array
                        items:
                          type: string
                        description: For dropdown fields
                      default_to_signing_date:
                        type: boolean
                        description: For date fields
                      multi_group_id:
                        type: string
                        format: uuid
                        description: Group ID for mutually exclusive checkbox/radio button groups
                      variable_name:
                        type: string
                      variable_defined_name:
                        type:
                        - string
                        - 'null'
                        maxLength: 100
                        description: Human-readable custom field definition name. Can be used as an alternative to variable_name for targeting fields in template-based creation.
                      required_conditions:
                        $ref: '#/components/schemas/ConditionSet'
                      visibility_conditions:
                        $ref: '#/components/schemas/ConditionSet'
                reminders:
                  type: array
                  description: Upsert reminders (include id to update, omit to create)
                  items:
                    type: object
                    required:
                    - hours
                    - subject
                    - message
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Omit for new reminders
                      hours:
                        type: integer
                        minimum: 1
                        description: Hours after sending before reminder
                      all_users:
                        type: boolean
                        default: false
                      user_id:
                        type: string
                        format: uuid
                        description: Required if all_users is false
                      subject:
                        type: string
                        maxLength: 255
                      message:
                        type: string
                        maxLength: 5000
      responses:
        '200':
          description: Template updated successfully. Returns full template with all relationships.
          headers:
            X-RateLimit-Limit:
              schema:
                type: integer
              description: 'Rate limit: 120 requests per minute'
            X-RateLimit-Remaining:
              schema:
                type: integer
            X-RateLimit-Reset:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'
      operationId: updateTemplate
      x-participant-order-contract:
        membership: Signer and Approver users plus organization seal participants share one contiguous 1-based order space. CC users use a separate sequence and never consume a participant position. users and deleted_users participate in the same atomic participant-set update.
        patch: 'On an unsent template, order must be in [1..n] for a move and [1..n+1] for a create. A move is shift-insert: every participant between the old and new positions is renumbered. A create with omitted order appends. Explicit order 0 is invalid.'
        lockedStates: An applied participant on an aborted-send request can narrow the reachable interval; this template operation has no sent state.
        create: When no seal is present, tied user order values are resolved deterministically and compacted to [1..n]. A seal-bearing create rejects a non-contiguous space or collision with INVALID_SIGNING_ORDER. When signing order is disabled, or any user omits order, participant orders follow array order.
        sideEffects: Shift-insert changes every participant between the old and new positions. Retrying a create after a later field write fails creates a second participant, matching the existing non-idempotent create contract.
        errors:
        - INVALID_SIGNING_ORDER
        - PARTICIPANTS_CHANGED
      x-codeSamples:
      - lang: TypeScript
        label: '@firma-dev/sdk'
