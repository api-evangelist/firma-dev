        errors:
          type: array
          description: All validation errors when multiple failures are reported together. The top-level error repeats the first item for backward compatibility.
          items:
            type: object
            required:
            - message
            properties:
              message:
                type: string
        message:
          type: string
          description: Detailed error description
        details:
          type: object
          description: Additional error details
          additionalProperties: true
      required:
      - error
      description: '


        Organization Seal error codes: SEALS_DISABLED, SEAL_ALREADY_REVOKED, SEAL_CREATION_DISABLED_EDGE, SEAL_ERASE_NOT_ELIGIBLE, SEAL_IMAGE_INVALID, SEAL_MUTATION_NOT_ALLOWED, SEAL_NOT_FOUND, SEAL_ORDER_COLLISION, SEAL_PAUSED, SEAL_SCOPE_FORBIDDEN, SEAL_UNAVAILABLE'
    UpdateSigningRequestBodySchema:
      type: object
      properties:
        signing_request_properties:
          type: object
          description: Update signing request properties
          properties:
            name:
              type: string
              maxLength: 255
            description:
              type: string
            document:
              type: string
              format: byte
              description: Replace document (base64-encoded PDF)
            expiration_hours:
              type: integer
              minimum: 1
            settings:
              $ref: '#/components/schemas/SigningRequestSettings'
            completion_title:
              type:
              - string
              - 'null'
              description: Heading shown on the completion page after signing. Null or an empty string clears the override.
              maxLength: 200
            completion_message:
              type:
              - string
              - 'null'
              description: Body text shown on the completion page after signing. Null or an empty string clears the override.
              maxLength: 1000
            completion_redirect_url:
              type:
              - string
              - 'null'
              format: uri
              description: URL the signer is redirected to from the completion page. Must use https:// (http://localhost and http://127.0.0.1 are also accepted on test-mode signing requests). Null or an empty string clears the override.
              maxLength: 2000
            completion_redirect_delay:
              type:
              - integer
              - 'null'
              description: Seconds the completion page waits before redirecting (0 redirects immediately). Only applies when a redirect URL resolves; the page falls back to 5 seconds when no level sets a delay. Null clears the override.
              minimum: 0
              maximum: 30
        recipients:
          type: array
          items:
            $ref: '#/components/schemas/Recipient'
          description: Upsert recipients - include 'id' to update existing recipients, use '_temp_id' (e.g., 'temp_1') for new recipients to reference them in fields and reminders within the same request. An existing recipient cannot be changed between CC and Signer/Approver (400); delete it and create it again.
        deleted_recipients:
          type: array
          items:
            $ref: '#/components/schemas/DeletedRecipient'
          description: Recipients to delete and how to handle their fields
        force_remove_conditions:
          type: boolean
          default: false
          description: 'When deleting recipients whose fields are referenced by conditions in other fields: if true, automatically remove the condition references; if false (default), the request will be rejected with an error listing the dependent fields.'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/Field'
          description: Upsert fields - include id to update, omit id to create new
        reminders:
          type: array
          items:
            $ref: '#/components/schemas/SigningRequestReminder'
          description: Upsert reminders - include id to update, omit id to create new
        language:
          type:
          - string
          - 'null'
          enum:
          - en
          - es
          - it
          - pt
          - fr
          - de
          - el
          - ru
          - pl
          - cs
          - sv
          - nl
          - ro
          - nb
          - ca
          description: Opt-in email language for this signing request. When set, all signer-facing emails (and their date formatting) use it. Omit or null to fall back to the workspace, then company, default language (unchanged behavior).
    InsufficientCreditsError:
      type: object
      properties:
        error:
          type: string
          example: Insufficient credits. Please purchase more credits to send signing requests.
        code:
          type: string
          example: INSUFFICIENT_CREDITS
        current_credits:
          type: integer
          example: 0
      description: Insufficient credits error
      required:
      - error
      - code
      - current_credits
    SigningRequestFieldListResponse:
      type: object
      description: List of signing request fields
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SigningRequestField'
      required:
      - results
    ConditionSet:
      type: object
      required:
      - logic
      - groups
      description: 'A set of condition groups with nested logic. The outer ''logic'' operator combines groups, while each group''s conditions use the opposite operator. Example: logic=''and'' means all groups must match, and within each group any condition can match (OR).'
      properties:
        logic:
          type: string
          enum:
          - and
          - or
          description: Logical operator to combine groups. 'and' = all groups must match, 'or' = any group can match.
        groups:
          type: array
          items:
            $ref: '#/components/schemas/ConditionGroup'
          description: Array of condition groups
    SigningRequestUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the signing request user
        name:
          type: string
          description: Recipient name (combined first and last name)
        email:
          type: string
          format: email
          description: Recipient email address
        first_name:
          type:
          - string
          - 'null'
          description: Recipient first name
        last_name:
          type:
          - string
          - 'null'
          description: Recipient last name
        designation:
          type: string
          enum:
          - Signer
          - Approver
          - CC
          description: Role of the recipient. Signer signs the document, Approver approves with approval fields, CC receives a copy when complete.
        order:
          type: integer
          minimum: 1
          description: Signing order
        finished_on:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp when this recipient completed all actions
        declined_on:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp when this recipient declined to sign
        decline_reason:
          type:
          - string
          - 'null'
          description: Reason provided by recipient for declining
        phone_number:
          type:
          - string
          - 'null'
          description: Recipient phone number
        street_address:
          type:
          - string
          - 'null'
          description: Recipient street address
        city:
          type:
          - string
          - 'null'
          description: Recipient city
        state_province:
          type:
          - string
          - 'null'
          description: Recipient state or province
        postal_code:
          type:
          - string
          - 'null'
          description: Recipient postal code
        country:
          type:
          - string
          - 'null'
          description: Recipient country
        title:
          type:
          - string
          - 'null'
          description: Recipient job title
        company:
          type:
          - string
          - 'null'
          description: Recipient company name
        custom_fields:
          type:
          - object
          - 'null'
          description: Custom field values for this recipient
        required_fields:
          type: array
          items:
            type: string
          description: List of recipient data fields required for sending (based on fields with variable_name mappings). Always includes 'email' and 'first_name'.
        missing_fields:
          type: array
          items:
            type: string
          description: List of required fields that are currently empty for this recipient
        required_read_only_fields:
          type: array
          items:
            type: object
            properties:
              variable_name:
                type:
                - string
                - 'null'
                description: Variable name of the read-only field
              variable_defined_name:
                type:
                - string
                - 'null'
                description: Human-readable field name from the custom field definition (e.g. 'artist_name'). Only present for fields linked to a custom field definition, null otherwise.
              field_type:
                type: string
                description: Type of the field (text, date, etc.)
              has_value:
                type: boolean
                description: Whether this read-only field has a value set
          description: List of required read-only fields that need pre-filled values before sending
        ready_to_send:
          type: boolean
          description: Whether this recipient has all required data filled in for sending
      required:
      - id
      - first_name
      - email
      - designation
      - order
    SigningRequestCreateField:
      type: object
      description: Field as returned in CREATE signing request responses (flat position, database-style)
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the field
        type:
          type: string
          enum:
          - text
          - signature
          - date
          - checkbox
          - dropdown
          - radio_buttons
          - number
          - text_area
          - file
          - initial
          - stamp
          - approval_signature
          - approval_checkmark
          - approval_date
          description: Type of the field
        recipient_id:
          type:
          - string
          - 'null'
          format: uuid
          description: ID of assigned recipient
        page_number:
          type: integer
          minimum: 1
          description: Page number (1-indexed)
        x_position:
          type: number
          description: X coordinate as percentage (0-100)
        y_position:
          type: number
          description: Y coordinate as percentage (0-100)
        width:
          type: number
          description: Width as percentage (0-100)
        height:
          type: number
          description: Height as percentage (0-100)
        required:
          type: boolean
          description: Whether the field is required
        read_only:
          type: boolean
          description: Whether this field is read-only
        read_only_value:
          type:
          - string
          - 'null'
          description: Static value for read-only fields
        variable_name:
          type:
          - string
          - 'null'
          description: Variable name for prefilled data mapping
        variable_defined_name:
          type:
          - string
          - 'null'
          description: Human-readable field name from the custom field definition (e.g. 'artist_name'). Only present for fields linked to a custom field definition, null otherwise.
        dropdown_options:
          description: Options for dropdown fields
          oneOf:
          - type: array
            items:
              type: string
          - type: object
        format_rules:
          type:
          - object
          - 'null'
          description: Formatting rules (e.g., date format)
        validation_rules:
          type:
          - object
          - 'null'
          description: Validation rules for the field
        date_signing_default:
          type: boolean
          description: Whether to use signing date as default
        final_value:
          type:
          - string
          - 'null'
          description: Pre-filled or final value of the field
      required:
      - type
      - recipient_id
      - page_number
    SigningRequestListResponse:
      type: object
      description: Paginated list of signing requests
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SigningRequestListItem'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
      - results
      - pagination
    Reminder:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the reminder
        hours:
          type: integer
          minimum: 1
          description: Hours after sending before reminder is sent
        subject:
          type: string
          description: Email subject for the reminder
          maxLength: 255
        message:
          type: string
          description: Email message body for the reminder
          maxLength: 5000
        all_users:
          type: boolean
          description: Whether reminder applies to all users
        template_user_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Specific user to send reminder to (used in template context)
        recipient_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Specific recipient to send reminder to (used in signing request context, same as template_user_id)
        sent_on:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp when the reminder was actually sent
        created_at:
          type: string
          format: date-time
          description: Reminder creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Reminder last update timestamp
      required:
      - id
      - hours
      - subject
      - message
  responses:
    UnauthorizedError:
      description: Unauthorized - Invalid or missing API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Unauthorized
            message: Invalid API key
    ForbiddenError:
      description: Forbidden - Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Forbidden
            message: You do not have permission to access this resource
    NotFoundError:
      description: Not Found - Resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Not Found
            message: The requested resource was not found
    ValidationError:
      description: Bad Request - Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Validation Error
            message: Invalid input data
            details:
              name: Name is required
              email: Invalid email format
    RateLimitError:
      description: Too Many Requests - Rate limit exceeded
      headers:
        X-RateLimit-Limit:
          schema:
            type: integer
          description: Maximum requests per minute
        X-RateLimit-Remaining:
          schema:
            type: integer
          description: Requests remaining
        X-RateLimit-Reset:
          schema:
            type: integer
          description: Unix timestamp of reset
        Retry-After:
          schema:
            type: integer
          description: Seconds until retry allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Rate Limit Exceeded
            message: Too many requests. Please wait before retrying.
            details:
              retry_after: 45
  requestBodies:
    UpdateSigningRequestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateSigningRequestBodySchema'
          examples:
            comprehensive-update:
              summary: Comprehensive update with all sections
              value:
                signing_request_properties:
                  name: Updated Contract Name
                  expiration_hours: 72
                recipients:
                - id: rec1-e89b-12d3-a456-426614174000
                  first_name: John
                  last_name: Smith
                  email: john.smith@example.com
                  designation: Signer
                  order: 1
                - first_name: Jane
                  last_name: Doe
                  email: jane@example.com
                  designation: Signer
                  order: 2
                deleted_recipients:
                - recipient_id: rec2-e89b-12d3-a456-426614174000
                  field_action: reassign
                  reassign_to_recipient_id: rec1-e89b-12d3-a456-426614174000
                fields:
                - id: field1-e89b-12d3-a456-426614174000
                  type: signature
                  position:
                    x: 15
                    y: 85
                    width: 30
                    height: 10
                  page_number: 1
                  required: true
                  recipient_id: rec1-e89b-12d3-a456-426614174000
                reminders:
                - hours: 48
                  all_users: true
                  subject: 'Reminder: Please sign the document'
                  message: This is a reminder to complete your signature.
            update-with-temp-ids:
              summary: Update with new recipients using temporary IDs
              description: Comprehensive update adding new recipients with temporary IDs alongside existing recipients
              value:
                signing_request_properties:
                  name: Updated NDA Agreement
                recipients:
                - id: existing-recipient-uuid
                  email: updated@example.com
                - _temp_id: temp_new_signer
                  first_name: New
                  last_name: Signer
                  email: newsigner@example.com
                  designation: Signer
                  order: 2
                fields:
                - id: existing-field-uuid
                  position:
                    x: 10
                    y: 70
                    width: 30
                    height: 10
                - recipient_id: temp_new_signer
                  type: signature
                  page_number: 1
                  position:
                    x: 10
                    y: 55
                    width: 30
                    height: 10
                  required: true
                reminders:
                - recipient_id: temp_new_signer
                  hours: 24
                  all_users: false
                  subject: 'Reminder: Sign Document'
                  message: Please sign the updated NDA.
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: API key for authentication. Use your API key directly without any prefix (e.g., 'your-api-key'). Bearer prefix is optional but not required.
