      operationId: patchSigningRequest
      x-participant-order-contract:
        membership: Signer and Approver recipients plus organization seal participants share one contiguous 1-based order space. CC recipients use a separate sequence and never consume a participant position.
        patch: 'On an unsent document, order must be in [1..n] for a move and [1..n+1] for a create. A move is shift-insert: every participant between the old and new positions is renumbered. A create with omitted order appends. Explicit order 0 is invalid.'
        lockedStates: A sent request accepts no membership or order change and returns SIGNING_ORDER_LOCKED_SENT. On an aborted-send request, an applied participant can narrow the reachable interval and an invalid move returns SIGNING_ORDER_LOCKED_APPLIED.
        create: When no seal is present, tied recipient order values are resolved deterministically and compacted to [1..n]. A seal-bearing create rejects a non-contiguous space or collision with INVALID_SIGNING_ORDER. When use_signing_order is false, or any recipient omits order, participant orders follow array order.
        sideEffects: Retrying a create after a later field write fails creates a second participant, matching the existing non-idempotent create contract.
        errors:
        - INVALID_SIGNING_ORDER
        - SIGNING_ORDER_LOCKED_SENT
        - SIGNING_ORDER_LOCKED_APPLIED
        - PARTICIPANTS_CHANGED
      x-codeSamples:
      - lang: TypeScript
        label: '@firma-dev/sdk'
        source: "import { FirmaClient } from \"@firma-dev/sdk\";\n\nconst firma = new FirmaClient({ apiKey: \"YOUR_API_KEY\" });\n\nconst response = await firma.signingRequests.patchSigningRequest({\n    id: \"id\",\n    body: {\n        name: \"Updated Contract Name\",\n        expiration_hours: 72\n    }\n});\nconsole.log(response);"
    put:
      summary: Comprehensive Update Signing Request
      description: 'Perform comprehensive updates to a signing request including properties, recipients, fields, and reminders. Cannot update after signing request has been sent, completed, or cancelled. All sections are optional but at least one must be provided.


        **Temporary ID Pattern for New Recipients**: When adding new recipients in a comprehensive update, use the ''_temp_id'' field (format: ''temp_X'') instead of ''id'' to establish relationships with fields and reminders. This allows you to create new recipients and reference them in fields/reminders in a single request. Use the ''id'' field to update existing recipients. Validation rules: (1) Temporary IDs must start with ''temp_''; (2) Each temporary ID must be unique within the request; (3) Fields and reminders can reference temporary IDs in their recipient_id property; (4) The API will automatically resolve temporary IDs to real UUIDs after recipient creation.'
      tags:
      - Signing Requests
      security:
      - ApiKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Signing request ID
      requestBody:
        $ref: '#/components/requestBodies/UpdateSigningRequestBody'
      responses:
