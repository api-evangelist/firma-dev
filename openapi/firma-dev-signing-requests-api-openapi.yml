      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                description: Update signing request properties only
                properties:
                  name:
                    type: string
                    maxLength: 255
                    description: New name for signing request
                  description:
                    type: string
