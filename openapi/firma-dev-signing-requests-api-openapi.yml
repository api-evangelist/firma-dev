                  settings:
                    $ref: '#/components/schemas/SigningRequestSettings'
                    description: Update settings
                  language:
                    type:
                    - string
                    - 'null'
                    enum:
                    - en
                    - es
                    - it
                    - pt
                    - fr
                    - de
                    - el
                    - ru
                    - pl
                    - cs
                    - sv
                    - nl
                    - ro
                    - nb
                    - ca
                    description: Opt-in email language for this signing request. When set, all signer-facing emails (and their date formatting) use it. Omit or null to fall back to the workspace, then company, default language (unchanged behavior).
                  completion_title:
                    type:
                    - string
                    - 'null'
                    description: Heading shown on the completion page after signing. Null or an empty string clears the override; omitted leaves it unchanged.
                    maxLength: 200
                  completion_message:
                    type:
                    - string
                    - 'null'
                    description: Body text shown on the completion page after signing. Null or an empty string clears the override; omitted leaves it unchanged.
                    maxLength: 1000
                  completion_redirect_url:
                    type:
                    - string
                    - 'null'
                    format: uri
                    description: URL the signer is redirected to from the completion page. Must use https:// (http://localhost and http://127.0.0.1 are also accepted on test-mode signing requests). Null or an empty string clears the override; omitted leaves it unchanged.
                    maxLength: 2000
                  completion_redirect_delay:
                    type:
                    - integer
                    - 'null'
                    description: Seconds the completion page waits before redirecting (0 redirects immediately). Only applies when a redirect URL resolves; the page falls back to 5 seconds when no level sets a delay. Null clears the override; omitted leaves it unchanged.
                    minimum: 0
                    maximum: 30
              - type: object
                required:
                - recipient
                description: Create or update a single recipient
                properties:
                  recipient:
                    $ref: '#/components/schemas/Recipient'
                    description: 'Recipient to create (omit id) or update (include id). When updating first_name or last_name, the name field is automatically reconstructed using existing values from database for any field not provided. Result: ''First Last'' if both exist, ''First'' if only first_name.'
              - type: object
                required:
                - field
                description: Create or update a single field
                properties:
                  field:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Include to update existing field, omit to create new
                      type:
