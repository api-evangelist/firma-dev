  /documents:
    post:
      summary: Upload a document
      description: Request a presigned upload URL for a document. Upload the file directly to the returned URL, then pass the document_id when creating a signing request. Use this for documents larger than 5MB that exceed the inline base64 request size limit.
      tags:
