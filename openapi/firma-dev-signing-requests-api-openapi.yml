openapi: 3.2.0
info:
  title: Firma Partner Signing Requests API
  description: RESTful API for document signing and template management.
  version: 01.38.00
  contact:
    name: API Support
    url: https://firma.com/support
servers:
- url: https://api.firma.dev/functions/v1/signing-request-api
  description: Production API - Recommended (Current)
- url: https://api.firma.dev/api/v1
  description: Production API - Planned
security:
- ApiKeyAuth: []
tags:
- name: Signing Requests
  description: Document signing request operations
paths:
  /signing-requests:
    get:
      summary: List Signing Requests
      description: Retrieve a paginated list of signing requests
      tags:
      - Signing Requests
      security:
      - ApiKeyAuth: []
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
        description: Page number
      - name: page_size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
        description: Items per page
      - name: name
        in: query
        schema:
          type: string
        description: Filter by signing request name (partial match, case-insensitive)
      - name: status
        in: query
        schema:
          type: string
          enum:
          - not_sent
          - in_progress
          - finished
          - cancelled
          - declined
          - deleted
          - expired
        description: 'Filter by signing request status. Supports multiple comma-separated values.


          **Available statuses:**

          - `not_sent`: Request created but not yet sent to signers

          - `in_progress`: Sent to signers but not completed, cancelled, declined, or expired

          - `finished`: All signers have completed

          - `cancelled`: Request was cancelled by sender

          - `declined`: A signer declined to sign (request stopped)

          - `deleted`: Soft-deleted records (normally hidden)

          - `expired`: Sent but past expiration time (sent_on + expiration_hours < now)


          **Example:** `?status=in_progress,expired`


          **Note:** The `expired` status uses post-filtering which may have performance implications on large datasets.'
      - name: created_after
        in: query
        schema:
          type: string
          format: date-time
        description: Filter signing requests created after this date (ISO 8601 format)
      - name: created_before
        in: query
        schema:
          type: string
          format: date-time
        description: Filter signing requests created before this date (ISO 8601 format)
      - name: signer_email
        in: query
        schema:
          type: string
        description: Filter by signer email address (exact match)
      - name: signer_name
        in: query
        schema:
          type: string
        description: Filter by signer name (partial match, case-insensitive)
      - name: sort_by
        in: query
        schema:
          type: string
          enum:
          - name
          - created_on
          - expiration_hours
          - sent_on
          - finished_on
          default: created_on
        description: Field to sort by
      - name: sort_order
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
        description: Sort order
      responses:
        '200':
          description: Signing requests retrieved successfully
          headers:
            X-RateLimit-Limit:
              schema:
                type: integer
              description: 'Rate limit: 200 requests per minute'
            X-RateLimit-Remaining:
              schema:
                type: integer
            X-RateLimit-Reset:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningRequestListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitError'
      operationId: listSigningRequests
      x-codeSamples:
      - lang: TypeScript
        label: '@firma-dev/sdk'
        source: 'import { FirmaClient } from "@firma-dev/sdk";


          const firma = new FirmaClient({ apiKey: "YOUR_API_KEY" });


          const response = await firma.signingRequests.listSigningRequests();

          console.log(response);'
    post:
      summary: Create Signing Request
      description: 'Create a new signing request either from a PDF document (document-based) or from an existing template (template-based). For document-based creation, allow_editing_before_sending is automatically set to true. For template-based creation, properties are inherited from the template and can be overridden.


        **Temporary ID Pattern**: For document-based creation, you can reference recipients before they''re created using temporary IDs (format: ''temp_X'' where X is any identifier, e.g., ''temp_1'', ''temp_alice''). Use these temporary IDs in recipient.id, field.recipient_id, and reminder.recipient_id. The API validates all references and automatically maps temporary IDs to real UUIDs after recipients are created. The response contains only real UUIDs.


        **Temporary ID Validation**: Temporary IDs must start with ''temp_'', be unique across all recipients in the request, and all field/reminder references must point to recipients defined in the same request. Invalid format, duplicate IDs, or missing recipient references return a 400 error with detailed validation messages.'
      tags:
      - Signing Requests
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                required:
                - document
                description: Create signing request from a PDF document
                properties:
                  document:
                    type: string
                    format: byte
                    description: Base64-encoded PDF or DOCX document. DOCX files are automatically converted to PDF. Page count will be auto-extracted. For documents larger than 5 MB, use POST /documents and pass the document_id instead.
                  name:
                    type: string
                    maxLength: 255
                    description: Name for the signing request
                  description:
                    type: string
                    description: Description for the signing request
                  expiration_hours:
                    type: integer
                    minimum: 1
                    default: 168
                    description: 'Hours until the signing request expires (default: 168 = 7 days)'
                  recipients:
                    type: array
                    items:
                      $ref: '#/components/schemas/Recipient'
                    description: Recipients for the signing request. Use temporary IDs (e.g., 'temp_1') in the id field to reference recipients in fields/reminders.
                  fields:
                    type: array
                    items:
                      $ref: '#/components/schemas/Field'
                    description: Fields to place on the document. Use recipient_id to assign fields to recipients.
                  anchor_tags:
                    type: array
                    maxItems: 100
                    items:
                      $ref: '#/components/schemas/AnchorTag'
                    description: Anchor tags for automatic field placement. Text markers in the PDF are located and converted to positioned fields. The anchor text is removed from the PDF after processing. Fields created from anchor tags are added alongside any manually specified fields. Only available for document-based creation (not template-based).
                  reminders:
                    type: array
                    items:
                      $ref: '#/components/schemas/SigningRequestReminder'
                    description: Reminders to send to recipients
                  settings:
                    $ref: '#/components/schemas/SigningRequestSettings'
                    description: Signing request settings
                  language:
                    type:
                    - string
                    - 'null'
                    enum:
                    - en
                    - es
                    - it
                    - pt
                    - fr
                    - de
                    - el
                    - ru
                    - pl
                    - cs
                    - sv
                    - nl
                    - ro
                    - nb
                    - ca
                    description: Opt-in email language for this signing request. When set, all signer-facing emails (and their date formatting) use it. Omit or null to fall back to the workspace, then company, default language (unchanged behavior).
                  completion_title:
                    type:
                    - string
                    - 'null'
                    description: Heading shown on the completion page after signing. Inherits from the workspace, then the company, when omitted or null.
                    maxLength: 200
                  completion_message:
                    type:
                    - string
                    - 'null'
                    description: Body text shown on the completion page after signing. Inherits from the workspace, then the company, when omitted or null.
                    maxLength: 1000
                  completion_redirect_url:
                    type:
                    - string
                    - 'null'
                    format: uri
                    description: URL the signer is redirected to from the completion page. Must use https:// (http://localhost and http://127.0.0.1 are also accepted on test-mode signing requests). Inherits from the workspace, then the company, when omitted or null.
                    maxLength: 2000
                  completion_redirect_delay:
                    type:
                    - integer
                    - 'null'
                    description: Seconds the completion page waits before redirecting (0 redirects immediately). Only applies when a redirect URL resolves; the page falls back to 5 seconds when no level sets a delay. Inherits from the workspace, then the company, when omitted or null.
                    minimum: 0
                    maximum: 30
                  seal_participants:
                    type: array
                    items:
                      $ref: '#/components/schemas/SealParticipantInput'
                    description: Organization seal participants to include in the signing sequence
              - type: object
                required:
                - template_id
                description: Create signing request from a template. Supports partial updates for both recipients and fields.
                properties:
                  template_id:
                    type: string
                    format: uuid
                    description: ID of the template to create signing request from. The document, fields, and default recipients will be copied from the template.
                  name:
                    type: string
                    maxLength: 255
                    description: Custom name for signing request (defaults to template name if not provided)
                  description:
                    type: string
                    description: Custom description (defaults to template description if not provided)
                  expiration_hours:
                    type: integer
                    minimum: 1
                    description: Override template expiration hours
                  recipients:
                    type: array
                    items:
                      $ref: '#/components/schemas/Recipient'
                    description: Optional recipient overrides. Use template_user_id (preferred) or order (fallback) to match template users. Only user info (first_name, last_name, email, phone_number, address fields, title, company) can be updated - order and designation are always inherited from template. Recipients not provided will use template defaults. Recipients with designation CC are never matched to template users; they are added as CC recipients. The template's CC recipients are copied to the signing request, skipping any whose email (case-insensitive) is already on a CC recipient of the request.
                  fields:
                    type: array
                    items:
                      $ref: '#/components/schemas/Field'
                    description: 'Optional field overrides for partial updates. Use template_field_id (preferred) or variable_name (fallback) to match template fields. Only provided properties override template defaults. Supported override properties: type, required, position, read_only, read_only_value, format_rules, validation_rules, dropdown_options, date_default, date_signing_default, multi_group_id. Fields not matched are ignored. If fields array is omitted, all template fields are used as-is.'
                  settings:
                    $ref: '#/components/schemas/SigningRequestSettings'
                    description: Override template settings
                  language:
                    type:
                    - string
                    - 'null'
                    enum:
                    - en
                    - es
                    - it
                    - pt
                    - fr
                    - de
                    - el
                    - ru
                    - pl
                    - cs
                    - sv
                    - nl
                    - ro
                    - nb
                    - ca
                    description: Opt-in email language for this signing request. When set, all signer-facing emails (and their date formatting) use it. Omit or null to fall back to the workspace, then company, default language (unchanged behavior).
                  completion_title:
                    type:
                    - string
                    - 'null'
                    description: Heading shown on the completion page after signing. Falls back to the template value, then the workspace and company defaults, when omitted or null.
                    maxLength: 200
                  completion_message:
                    type:
                    - string
                    - 'null'
                    description: Body text shown on the completion page after signing. Falls back to the template value, then the workspace and company defaults, when omitted or null.
                    maxLength: 1000
                  completion_redirect_url:
                    type:
                    - string
                    - 'null'
                    format: uri
                    description: URL the signer is redirected to from the completion page. Must use https:// (http://localhost and http://127.0.0.1 are also accepted on test-mode signing requests). Falls back to the template value, then the workspace and company defaults, when omitted or null.
                    maxLength: 2000
                  completion_redirect_delay:
                    type:
                    - integer
                    - 'null'
                    description: Seconds the completion page waits before redirecting (0 redirects immediately). Only applies when a redirect URL resolves; the page falls back to 5 seconds when no level sets a delay. Falls back to the template value, then the workspace and company defaults, when omitted or null.
                    minimum: 0
                    maximum: 30
                  seal_participants:
                    type: array
                    items:
                      $ref: '#/components/schemas/SealParticipantInput'
                    description: Organization seal participants to include in the signing sequence
                example:
                  template_id: 21424147-11c0-43d5-ac5f-a1f7001b5607
                  name: Contract for Client X
                  recipients:
                  - template_user_id: template-user-uuid-1
                    first_name: Toni
                    last_name: Campins
                    email: acampins@cocodin.com
                  fields:
                  - template_field_id: field-uuid-1
                    read_only: true
                    read_only_value: 'Contract #12345'
                  - variable_name: company_name
                    read_only_value: Acme Corporation
              properties:
                seal_participants:
                  type: array
                  items:
                    $ref: '#/components/schemas/SealParticipantInput'
                  description: Organization seal participants to include in the signing sequence
                fields:
                  type: array
                  items:
                    allOf:
                    - $ref: '#/components/schemas/Field'
                    - type: object
                      properties:
                        seal_participant_temp_id:
                          type: string
                          description: Temporary ID of the seal participant this field is assigned to (matches temp_id in seal_participants array)
                    properties:
                      seal_participant_temp_id:
                        type: string
                        description: Temporary ID of the seal participant this field is assigned to (matches temp_id in seal_participants array)
                  description: Fields to place on the document
            examples:
              update-properties:
                summary: Update properties
                value:
                  name: Updated Contract Name
                  expiration_hours: 72
              update-recipient:
                summary: Update single recipient
                value:
                  recipient:
                    id: rec123-e89b-12d3-a456-426614174000
                    first_name: John
                    last_name: Smith
                    email: john.smith@example.com
                    designation: Signer
                    order: 1
              add-recipient:
                summary: Add new recipient
                value:
                  recipient:
                    first_name: Jane
                    last_name: Doe
                    email: jane@example.com
                    designation: Signer
                    order: 2
              add-date-field:
                summary: Add date field with formatting
                value:
                  field:
                    type: date
                    position:
                      x: 70
                      y: 45
                      width: 15
                      height: 3
                    page_number: 1
                    required: true
                    recipient_id: rec123-e89b-12d3-a456-426614174000
                    date_signing_default: true
                    format_rules:
                      dateFormat: MMMM dd, yyyy
              add-read-only-static-field:
                summary: Add read-only field with static value
                description: Creates a text field that displays a fixed value the signer cannot edit
                value:
                  field:
                    type: text
                    position:
                      x: 15
                      y: 20
                      width: 40
                      height: 3
                    page_number: 1
                    required: false
                    recipient_id: rec123-e89b-12d3-a456-426614174000
                    read_only: true
                    read_only_value: 'Contract #12345 - Acme Corporation'
              add-read-only-prefilled-field:
                summary: Add read-only field with recipient data
                description: Creates a text field that auto-populates with the recipient's email address (signer cannot edit)
                value:
                  field:
                    type: text
                    position:
                      x: 15
                      y: 30
                      width: 30
                      height: 3
                    page_number: 1
                    required: false
                    recipient_id: rec123-e89b-12d3-a456-426614174000
                    read_only: true
                    prefilled_data: email
      responses:
        '201':
          description: Signing request created successfully. The response may include non-blocking email or anchor-tag warnings.
          headers:
            X-RateLimit-Limit:
              schema:
                type: integer
              description: 'Rate limit: 120 requests per minute'
            X-RateLimit-Remaining:
              schema:
                type: integer
            X-RateLimit-Reset:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningRequestCreateResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
          description: Invalid input - must provide either 'document' or 'template_id', not both. Document must be valid base64-encoded PDF under 6MB request payload (~4.5MB raw). Template must exist and belong to workspace.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Template not found or does not belong to workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Anchor-tag processing is disabled on the edge fallback. Retry through the primary API route.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - code
                properties:
                  error:
                    type: string
                  code:
                    type: string
                    enum:
                    - ANCHOR_DISABLED_EDGE
        '429':
          $ref: '#/components/responses/RateLimitError'
      operationId: createSigningRequest
      x-codeSamples:
      - lang: TypeScript
        label: '@firma-dev/sdk'
        source: "import { FirmaClient } from \"@firma-dev/sdk\";\n\nconst firma = new FirmaClient({ apiKey: \"YOUR_API_KEY\" });\n\nconst response = await firma.signingRequests.createSigningRequest({\n    template_id: \"template_id\",\n    name: \"Updated Contract Name\",\n    expiration_hours: 72\n});\nconsole.log(response);"
  /signing-requests/create-and-send:
    post:
      summary: Create and Send Signing Request (Atomic)
      description: 'Create and immediately send a signing request in a single atomic operation. This endpoint combines the functionality of POST /signing-requests and POST /signing-requests/{id}/send.


        **Key Benefits:**

        - Single API call instead of two separate requests

        - Validates all send requirements BEFORE creating the signing request

        - Atomic credit deduction - only charges if everything succeeds

        - Returns status: ''sent'' immediately with first signer details

        - More efficient (saves 1 API call + round-trip time)


        **Validation:**

        - All standard creation validations (document/template, recipients, fields)

        - Additional send validations:

        - All signers must have first_name and valid email

        - Required read-only fields must have final_value populated

        - Prefilled data fields (variable_name) must have corresponding user data

        - Company must have sufficient credits (≥1)


        **Atomicity:**

        - If any validation fails, nothing is created

        - Credit is only deducted after successful creation and before email send

        - If email send fails after creation, signing request remains in ''draft'' status and credit is NOT deducted


        **Temporary ID Pattern:** For document-based creation, use temporary IDs (format: ''temp_X'') to reference recipients before creation. The API validates all references and automatically maps temporary IDs to real UUIDs.


        **Rate Limit:** 120 requests/minute (same as write operations)'
      tags:
      - Signing Requests
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  maxLength: 255
                  description: Signing request name
                  example: Employment Contract - John Doe
                description:
                  type: string
                  description: Signing request description
                  example: Full-time employment contract for Software Engineer position
                document:
                  type: string
                  format: byte
                  description: Base64-encoded PDF or DOCX document (mutually exclusive with template_id and document_id). DOCX files are automatically converted to PDF. For documents larger than 5 MB, use POST /documents and pass the document_id instead.
                  example: JVBERi0xLjQKJeLjz9MKMyAwIG9iago8PC9UeXBlIC9QYWdlCi9QYXJlbnQgMSAwIFIKL1Jlc291c...
                template_id:
                  type: string
                  format: uuid
                  description: Template ID to use (mutually exclusive with document and document_id)
                  example: 123e4567-e89b-12d3-a456-426614174000
                expiration_hours:
                  type: integer
                  minimum: 1
                  default: 168
                  description: 'Hours until signing request expires (default: 168 = 7 days)'
                  example: 168
                recipients:
                  type: array
                  description: 'Array of recipients. At least one must be a Signer. For document-based: required. For template-based: optional (uses template recipients if omitted). Use template_user_id (preferred) or order (fallback) to match template users. Recipients with designation CC are never matched to template users; they are added as CC recipients. The template''s CC recipients are copied to the signing request, skipping any whose email (case-insensitive) is already on a CC recipient of the request.'
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/Recipient'
                fields:
                  type: array
                  description: Array of fields to be filled (document-based only)
                  items:
                    type: object
                    required:
                    - type
                    - page
                    - x
                    - y
                    properties:
                      recipient_id:
                        type: string
                        description: Temporary ID or UUID of recipient assigned to this field
                        example: temp_signer_1
                      type:
                        type: string
                        enum:
                        - signature
                        - initial
                        - text
                        - date
                        - checkbox
                        - dropdown
                        - radio_buttons
                        - text_area
                        - url
                        - file
                        - stamp
                        - approval_signature
                        - approval_checkmark
                        - approval_date
                        description: 'Field type. Accepts aliases: "initials" (normalized to "initial"), "textarea" (normalized to "text_area"), "radio" (normalized to "radio_buttons").'
                        example: signature
                      page:
                        type: integer
                        minimum: 1
                        description: PDF page number (1-indexed)
                        example: 1
                      x:
                        type: number
                        description: X coordinate on page
                        example: 100
                      y:
                        type: number
                        description: Y coordinate on page
                        example: 200
                      width:
                        type: number
                        default: 200
                        example: 200
                      height:
                        type: number
                        default: 50
                        example: 50
                      variable_name:
                        type: string
                        description: Variable name for prefilled data (e.g., 'phone_number', 'company'). If set, the corresponding recipient field must be populated.
                        enum:
                        - first_name
                        - last_name
                        - full_name
                        - email
                        - phone_number
                        - street_address
                        - city
                        - state_province
                        - postal_code
                        - country
                        - title
                        - company
                        example: phone_number
                      variable_defined_name:
                        type:
                        - string
                        - 'null'
                        maxLength: 100
                        description: Human-readable custom field definition name. Can be used as an alternative to variable_name for targeting fields in template-based creation.
                      required:
                        type: boolean
                        default: false
                        description: Whether field is required
                      read_only:
                        type: boolean
                        default: false
                        description: Whether field is read-only (pre-filled)
                      final_value:
                        type: string
                        description: Pre-filled value for read-only fields (required if read_only=true and required=true)
                        example: Software Engineer
                      background_color:
                        type:
                        - string
                        - 'null'
                        pattern: ^#([0-9A-Fa-f]{3}|[0-9A-Fa-f]{6})$
                        description: Background color as hex (e.g., '#FFFDE7')
                        example: '#FFFDE7'
                      dropdown_options:
                        description: Options for dropdown fields. Required when type is "dropdown".
                        example:
                        - Option A
                        - Option B
                        - Option C
                        oneOf:
                        - type: array
                          items:
                            type: string
                        - type: object
                      seal_participant_temp_id:
                        type: string
                        description: Temporary ID of the seal participant this field is assigned to (matches temp_id in seal_participants array)
                anchor_tags:
                  type: array
                  maxItems: 100
                  items:
                    $ref: '#/components/schemas/AnchorTag'
                  description: Anchor tags for automatic field placement. Text markers in the PDF are located and converted to positioned fields. The anchor text is removed from the PDF after processing. Fields created from anchor tags are added alongside any manually specified fields. Only available for document-based creation (not template-based).
                reminders:
                  type: array
                  description: Array of reminder configurations
                  items:
                    type: object
                    required:
                    - hours_before_expiration
                    properties:
                      hours_before_expiration:
                        type: integer
                        minimum: 1
                        description: Hours before expiration to send reminder
                        example: 24
                settings:
                  type: object
                  description: Signing request settings
                  properties:
                    use_signing_order:
                      type: boolean
                      default: true
                      description: Enforce signing order based on recipient.order. When false, all signers receive the document simultaneously.
                    allow_download:
                      type: boolean
                      default: true
                      description: Allow recipients to download document
                    attach_pdf_on_finish:
                      type: boolean
                      default: true
                      description: Attach completed PDF to completion email
                    send_signing_email:
                      type: boolean
                      default: true
                      description: Send email notification to signers
                    send_finish_email:
                      type: boolean
                      default: true
                      description: Send email when all signatures complete
                    send_expiration_email:
                      type: boolean
                      default: true
                      description: Send email when request expires
                    send_cancellation_email:
                      type: boolean
                      default: true
                      description: Send email when request is cancelled
                    hand_drawn_only:
                      type: boolean
                      default: false
                      description: Require signers to hand-draw their signatures instead of using typed signatures
                    identity_editable_fields:
                      type:
                      - array
                      - 'null'
                      items:
                        type: string
                        enum:
                        - name
                        - company
                        - title
                        - phone
                        - address
                      description: Identity fields signers can edit before signing. null = disabled. When set, a confirmation dialog appears allowing signers to edit the specified fields.
                      example:
                      - name
                      - company
                    notify_identity_change_webhook:
                      type: boolean
                      default: false
                      description: Send webhook event when a signer changes their identity
                    notify_identity_change_email:
                      type: boolean
                      default: false
                      description: Send email notification when a signer changes their identity
                document_id:
                  type: string
                  format: uuid
                  description: ID of a previously uploaded document (mutually exclusive with document and template_id). Obtain by calling POST /documents first.
                  example: 123e4567-e89b-12d3-a456-426614174000
                language:
                  type:
                  - string
                  - 'null'
                  enum:
                  - en
                  - es
                  - it
                  - pt
                  - fr
                  - de
                  - el
                  - ru
                  - pl
                  - cs
                  - sv
                  - nl
                  - ro
                  - nb
                  - ca
                  description: Opt-in email language for this signing request. When set, all signer-facing emails (and their date formatting) use it. Omit or null to fall back to the workspace, then company, default language (unchanged behavior).
                completion_title:
                  type:
                  - string
                  - 'null'
