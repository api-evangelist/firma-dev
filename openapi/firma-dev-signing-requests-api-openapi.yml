  /signing-requests/{id}/seal-participants/{participant_id}:
    delete:
      summary: Remove a seal participant from an unsent signing request
      description: Remove a seal participant and the fields it owns from a signing request that has not been sent yet. After send, a seal participant can only be swapped (while paused) or the request cancelled.
      tags:
      - Signing Requests
      operationId: deleteSealParticipant
      security:
      - ApiKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Signing request ID
      - name: participant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Seal participant ID
      responses:
        '200':
          description: Seal participant removed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: The participant set changed, the request was sent, or an applied participant prevents compaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                sent:
                  value:
                    error: The signing order is locked after send
                    code: SIGNING_ORDER_LOCKED_SENT
                applied:
                  value:
                    error: An applied participant cannot be moved
                    code: SIGNING_ORDER_LOCKED_APPLIED
                changed:
                  value:
                    error: Participants changed since they were loaded
                    code: PARTICIPANTS_CHANGED
        '429':
          $ref: '#/components/responses/RateLimitError'
      x-participant-order-contract:
        membership: Signer and Approver recipients plus organization seal participants share one contiguous 1-based order space. CC recipients use a separate sequence and never consume a participant position.
        patch: 'On an unsent document, order must be in [1..n] for a move and [1..n+1] for a create. A move is shift-insert: every participant between the old and new positions is renumbered. A create with omitted order appends. Explicit order 0 is invalid.'
        lockedStates: A sent request accepts no membership or order change and returns SIGNING_ORDER_LOCKED_SENT. On an aborted-send request, an applied participant can narrow the reachable interval and an invalid move returns SIGNING_ORDER_LOCKED_APPLIED.
        create: When no seal is present, tied recipient order values are resolved deterministically and compacted to [1..n]. A seal-bearing create rejects a non-contiguous space or collision with INVALID_SIGNING_ORDER. When use_signing_order is false, or any recipient omits order, participant orders follow array order.
        sideEffects: Retrying a create after a later field write fails creates a second participant, matching the existing non-idempotent create contract.
        errors:
        - INVALID_SIGNING_ORDER
        - SIGNING_ORDER_LOCKED_SENT
        - SIGNING_ORDER_LOCKED_APPLIED
        - PARTICIPANTS_CHANGED
components:
  schemas:
    SigningRequestDownloadResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - finished
          - in_progress
          - cancelled
          - declined
          - expired
          description: Signing request status. `finished` means all signers have completed. `in_progress` means signing is still ongoing and this is a partial download. `cancelled`, `declined`, and `expired` indicate terminal states where the document is a partial snapshot from the point when signing ended.
        is_partial:
          type: boolean
          description: Whether this download URL points to a partially-signed document (not all signers have completed).
        download_url:
          type: string
          format: uri
          description: Pre-signed URL to download the PDF document. Expires at the time indicated by `expires_at`.
        generated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: ISO 8601 timestamp when the document was last generated. For partial downloads, this is when the partial PDF was created.
        expires_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the `download_url` expires. Fetch this endpoint again for a fresh URL after expiry.
      required:
      - status
      - is_partial
      - download_url
      - expires_at
    DateFormatRules:
      type: object
      description: Formatting rules for date fields. Specifies how date values should be displayed and formatted.
      properties:
        dateFormat:
          type: string
          description: 'Date format pattern. Use predefined formats or custom patterns with: yyyy (4-digit year), MM (2-digit month), dd (2-digit day), MMMM (full month name), MMM (abbreviated month name), HH (24-hour), mm (minute), ss (second). Examples: ''MM/dd/yyyy'' displays as 01/31/2024, ''MMMM dd, yyyy'' displays as January 31, 2024.'
          enum:
          - MM/dd/yyyy
          - dd/MM/yyyy
          - yyyy-MM-dd
          - MMMM dd, yyyy
          - MMM dd, yyyy
          - dd MMMM yyyy
          default: MM/dd/yyyy
        fontSize:
          type: integer
          minimum: 8
          maximum: 48
          description: Optional starting/maximum font size in pixels for the rendered field value. Text still auto-shrinks to fit the field box. Omit for automatic sizing. Values outside 8-48 are clamped.
      example:
        dateFormat: MMMM dd, yyyy
    SealParticipant:
      type: object
      description: Seal participant on a signing request or template.
      properties:
        id:
          type: string
          format: uuid
        organization_seals_id:
          type: string
          format: uuid
        order:
          type: integer
          minimum: 1
        deleted:
          type: integer
          enum:
          - 0
          - 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ConditionGroup:
      type: object
      required:
      - conditions
      properties:
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
          description: Array of conditions within this group. Combined using the opposite of the parent ConditionSet's logic operator.
    SealParticipantInput:
      type: object
      required:
      - seal_id
      - order
      description: Seal participant assignment for a signing request or template.
      properties:
        seal_id:
          type: string
          format: uuid
          description: ID of the organization seal to apply
        order:
          type: integer
          minimum: 1
          description: Position in the signing sequence
        temp_id:
          type: string
          description: Temporary ID for referencing in field assignments within the same request
    SigningRequestListRecipient:
      type: object
      description: Recipient as returned in LIST signing request responses (simplified shape)
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the recipient
        name:
          type: string
          description: Combined full name
        email:
          type: string
          format: email
          description: Recipient email address
        designation:
          type: string
          enum:
          - Signer
          - Approver
          - CC
          description: Role of the recipient. Signer signs the document, Approver approves with approval fields, CC receives a copy when complete.
        order:
          type: integer
          minimum: 1
          description: Signing order
        finished_date:
          type:
          - string
          - 'null'
          format: date-time
          description: When this recipient completed signing
        signature_details:
          type:
          - object
          - 'null'
          description: Details about the recipient's signature
    FileFormatRules:
      type: object
      description: Formatting rules for file upload fields. Specifies which file types signers are allowed to upload.
      properties:
        acceptedFileTypes:
          type: string
          enum:
          - image_and_pdf
          - image
          - pdf
          default: image_and_pdf
          description: Accepted file types for upload. 'image_and_pdf' accepts JPG, PNG, and PDF. 'image' accepts JPG and PNG only. 'pdf' accepts PDF only. Files are validated by magic bytes, not just extension. Maximum file size is 10MB.
      example:
        acceptedFileTypes: image_and_pdf
    SigningRequestDetail:
      type: object
      description: Detailed signing request as returned by GET /signing-requests/{id} (nested shape with status object and timestamps)
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the signing request
        name:
          type: string
          description: Signing request name
        template_description:
          type:
          - string
          - 'null'
          description: Description from the template
        companies_workspaces_id:
          type: string
          format: uuid
          description: Workspace ID this signing request belongs to
        document_url:
          type: string
          format: uri
          description: Pre-signed URL to the PDF document
        document_url_expires_at:
          type:
          - string
          - 'null'
          format: date-time
        document_page_count:
          type: integer
          minimum: 1
          description: Number of pages in the document
        expiration_hours:
          type: integer
          description: Hours until signing request expires
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: ISO 8601 timestamp when the signing request expires. Computed from sent_on + expiration_hours. Null if not sent yet or no expiration_hours set.
        credit_cost:
          type: integer
          description: Credits consumed when sent
        status:
          type: object
          description: Status flags (multiple can be true for terminal states)
          properties:
            sent:
              type: boolean
            finished:
              type: boolean
            cancelled:
              type: boolean
            declined:
              type: boolean
            expired:
              type: boolean
        timestamps:
          type: object
          description: All relevant timestamps for the signing request lifecycle
          properties:
            created_on:
              type: string
              format: date-time
            sent_on:
              type:
              - string
              - 'null'
              format: date-time
            finished_on:
              type:
              - string
              - 'null'
              format: date-time
            cancelled_on:
              type:
              - string
              - 'null'
              format: date-time
            declined_on:
              type:
              - string
              - 'null'
              format: date-time
            last_changed_on:
              type: string
              format: date-time
            last_signing_action_on:
              type:
              - string
              - 'null'
              format: date-time
        settings:
          $ref: '#/components/schemas/SigningRequestSettings'
        use_signing_order:
          type: integer
          enum:
          - 0
          - 1
          deprecated: true
        allow_download:
          type: integer
          enum:
          - 0
          - 1
          deprecated: true
        allow_editing_before_sending:
          type: integer
          enum:
          - 0
          - 1
          deprecated: true
        hand_drawn_only:
          type: integer
          enum:
          - 0
          - 1
          deprecated: true
        attach_pdf_on_finish:
          type: integer
          enum:
          - 0
          - 1
          deprecated: true
        certificate:
          type:
          - object
          - 'null'
          description: Certificate generation status information
          properties:
            generated:
              type: boolean
              description: Whether the final certificate PDF has been generated
            generated_on:
              type:
              - string
              - 'null'
              format: date-time
              description: Timestamp when certificate was generated
            has_error:
              type: boolean
              description: Whether there was an error generating the certificate
        final_document_download_url:
          type:
          - string
          - 'null'
          format: uri
          description: Signed URL to download the final signed document (PDF with certificate). URL expires after 1 hour.
        final_document_download_error:
          type:
          - string
          - 'null'
          enum:
          - file_not_accessible
          - null
        document_only_download_url:
          type:
          - string
          - 'null'
          format: uri
          description: Signed URL to download the document-only PDF. URL expires after 1 hour.
        document_only_download_error:
          type:
          - string
          - 'null'
          enum:
          - file_not_accessible
          - null
        certificate_only_download_url:
          type:
          - string
          - 'null'
          format: uri
          description: Signed URL to download the certificate-only PDF. URL expires after 1 hour.
        certificate_only_download_error:
          type:
          - string
          - 'null'
          enum:
          - file_not_accessible
          - null
        seal_participants:
          type: array
          description: Organization seal participants in the signing order. Empty when the request has no seals.
          items:
            $ref: '#/components/schemas/SealParticipant'
      required:
      - id
      - name
      - status
      - companies_workspaces_id
    Recipient:
      type: object
      required:
      - first_name
      - email
      - designation
      description: 'Recipient schema with auto-construction and mapping behaviors. **Name field**: Auto-constructed from first_name and last_name (''First Last'' if both present, otherwise ''First''). Manual name values are overwritten. **Order assignment**: ALL recipients MUST have an explicit order value. Order determines the signing sequence, which is always enforced. Recipients must sign in order, with lower numbers signing first. **Custom fields**: Supports both flat structure (e.g., company_name at root) and nested structure (custom_fields object). Both formats are normalized internally. **Template field mapping**: When creating from a template with custom recipients, use template_user_id or order to match template users. Only user info (name, email, phone, etc.) can be updated - order and designation are inherited from template. A recipient with designation CC is never matched to a template user; it is added as a CC recipient, and the template''s CC recipients are copied to the signing request, skipping any whose email (case-insensitive) is already on a CC recipient of the request. **Temporary IDs**: For document-based creation, use temporary IDs (format: ''temp_1'', ''temp_2'', etc.) to reference recipients in fields and reminders before they''re created. **CC recipients**: CC recipients receive a completed copy but cannot sign or have fields assigned. At least one Signer is required. An existing recipient cannot be changed between CC and Signer/Approver (400); delete it and create it again.'
      properties:
        id:
          type: string
          description: 'Unique identifier. For updates: use existing UUID. For document-based creation: optionally use temporary ID (format: ''temp_1'', ''temp_2'', etc.) to reference recipients in fields and reminders before creation. Temporary IDs are automatically resolved to real UUIDs in the response.'
        _temp_id:
          type: string
          description: Temporary identifier for new recipients in PUT (comprehensive update) requests (e.g., 'temp_1'). Use this when creating new recipients alongside existing ones in comprehensive updates. Must start with 'temp_' and be unique within the request. Not used for POST (create) requests - use 'id' field instead.
        template_user_id:
          type: string
          format: uuid
          description: When creating from a template, the ID of the template user to update. If provided, this recipient's data will update the matching template user. If not provided, falls back to matching by order. Only user info (name, email, phone, address, title, company) can be updated - order and designation are always inherited from the template. Not used for CC recipients, which are never matched to a template user.
        first_name:
          type: string
          maxLength: 100
          description: Recipient's first name
        last_name:
          type: string
          maxLength: 100
          description: Recipient's last name (optional, but required if using full_name or last_name prefilled variables)
        email:
          type: string
          format: email
          maxLength: 255
          description: Recipient's email address
        designation:
          type: string
          enum:
          - Signer
          - Approver
          - CC
          description: Role of the recipient. Signer signs the document, Approver approves with approval fields, CC receives a copy when complete.
        order:
          type: integer
          minimum: 1
          description: Signing sequence number. Recipients must sign in order, with lower numbers signing first. This field is required for all recipients.
        phone_number:
          type:
          - string
          - 'null'
          maxLength: 50
          description: Recipient's phone number
        street_address:
          type:
          - string
          - 'null'
          maxLength: 255
          description: Street address
        city:
          type:
          - string
          - 'null'
          maxLength: 100
          description: City
        state_province:
          type:
          - string
          - 'null'
          maxLength: 100
          description: State or province
        postal_code:
          type:
          - string
          - 'null'
          maxLength: 20
          description: Postal/ZIP code
        country:
          type:
          - string
          - 'null'
          maxLength: 100
          description: Country
        title:
          type:
          - string
          - 'null'
          maxLength: 100
          description: Job title
        company:
          type:
          - string
          - 'null'
          maxLength: 255
          description: Company name
        custom_fields:
          type: object
          additionalProperties: true
          description: Custom key-value pairs for additional recipient data
    SigningRequestField:
      type: object
      description: Field associated with a signing request, containing position, type, and value information
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the field
        type:
          type: string
          enum:
          - text
          - signature
          - date
          - checkbox
          - initial
          - dropdown
          - radio_buttons
          - text_area
          - url
          - file
          - stamp
          - approval_signature
          - approval_checkmark
          - approval_date
          description: Type of the field. Clean alias for field_type.
        recipient_id:
          type:
          - string
          - 'null'
          format: uuid
          description: ID of the recipient assigned to this field. Clean alias for companies_workspaces_signing_requests_users_id.
        value:
          type:
          - string
          - 'null'
          description: Final signed value of the field. Clean alias for final_value.
        position:
          type: object
          description: Position and dimensions of the field on the document. All values are percentages (0-100).
          properties:
            x:
              type:
              - number
              - 'null'
              description: X position (percentage, 0-100). Clean alias for x_postion.
            y:
              type:
              - number
              - 'null'
              description: Y position (percentage, 0-100). Clean alias for y_position.
            width:
              type:
              - number
              - 'null'
              description: Width (percentage, 0-100).
            height:
              type:
              - number
              - 'null'
              description: Height (percentage, 0-100). Clean alias for heigh.
        companies_workspaces_signing_requests_id:
          type: string
          format: uuid
          description: 'Deprecated: redundant with path parameter. ID of the signing request this field belongs to.'
        companies_workspaces_signing_requests_users_id:
          type:
          - string
          - 'null'
          format: uuid
          description: 'Deprecated: use ''recipient_id'' instead. ID of the recipient assigned to this field.'
        field_type:
          type: string
          enum:
          - text
          - signature
          - date
          - checkbox
          - initial
          - dropdown
          - radio_buttons
          - text_area
          - url
          - file
          - stamp
          - approval_signature
          - approval_checkmark
          - approval_date
          description: 'Deprecated: use ''type'' instead. Type of the field.'
        required:
          type: boolean
          description: Whether the field is required.
        x_postion:
          type:
          - number
          - 'null'
          description: 'Deprecated: use ''position.x'' instead. X position (note: column name has typo).'
        y_position:
          type:
          - number
          - 'null'
          description: 'Deprecated: use ''position.y'' instead. Y position of the field.'
        width:
          type:
          - number
          - 'null'
          description: 'Deprecated: use ''position.width'' instead. Width of the field.'
        heigh:
          type:
          - number
          - 'null'
          description: 'Deprecated: use ''position.height'' instead. Height (note: column name has typo).'
        page_number:
          type:
          - integer
          - 'null'
          description: Page number where the field is located (1-indexed)
        tl_position:
          type:
          - number
          - 'null'
          description: Top-left corner position
        tr_position:
          type:
          - number
          - 'null'
          description: Top-right corner position
        bl_position:
          type:
          - number
          - 'null'
          description: Bottom-left corner position
        br_position:
          type:
          - number
          - 'null'
          description: Bottom-right corner position
        variable_name:
          type:
          - string
          - 'null'
          description: Variable name for prefilled data mapping
        variable_defined_name:
          type:
          - string
          - 'null'
          description: Human-readable field name from the custom field definition (e.g. 'artist_name'). Only present for fields linked to a custom field definition, null otherwise.
        final_value:
          type:
          - string
          - 'null'
          description: 'Deprecated: use ''value'' instead. Final signed value of the field.'
        date_default:
          type:
          - string
          - 'null'
          description: Default date value
        date_signing_default:
          type:
          - boolean
          - 'null'
          description: Whether to use signing date as default.
        format_rules:
          type:
          - object
          - 'null'
          description: Formatting rules (e.g., date format)
        validation_rules:
          type:
          - object
          - 'null'
          description: Validation rules for the field
        dropdown_options:
          description: Options for dropdown fields
          oneOf:
          - type: array
            items:
              type: string
          - type: object
        multi_group_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Group ID for linking multiple checkbox or radio button fields together. Fields sharing the same multi_group_id behave as a mutually exclusive group (like radio buttons) - selecting one automatically deselects the others in the group. Use the same UUID across multiple fields to create a group where only one option can be selected at a time.
        read_only:
          type: boolean
          description: Whether the field is read-only.
        read_only_value:
          type:
          - string
          - 'null'
          description: Static value for read-only fields
        background_color:
          type:
          - string
          - 'null'
          description: Background color as hex (e.g., '#FFFDE7')
        calculated_font_size:
          type:
          - number
          - 'null'
          description: Calculated font size for the field
        deleted:
          type: integer
          enum:
          - 0
          - 1
          description: 'Deprecated: internal field, will be removed in v2. Soft delete flag (0 = active, 1 = deleted).'
      required:
      - id
      - field_type
      - page_number
    CreateAndSendValidationError:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
          description: Machine-readable error code
          example: VALIDATION_ERROR
        phase:
          type: string
          enum:
          - create_validation
          - send_validation
          description: Which validation phase failed
        validation_errors:
          type: array
          description: Detailed validation errors for send phase
          items:
            type: object
            properties:
              recipient_index:
                type: integer
                description: 1-based index of recipient
              recipient_email:
                type: string
              missing_fields:
                type: array
                items:
                  type: string
                description: List of missing required fields
        errors:
          type: array
          description: All validation errors when multiple failures are reported together. The top-level error repeats the first item for backward compatibility.
          items:
            type: object
            required:
            - message
            properties:
              message:
                type: string
      description: Validation error during create-and-send
      required:
      - error
      - code
    FieldValidationRules:
      type:
      - object
      - 'null'
      description: Validation rules for field values. Reserved for future use - currently not enforced for any field types.
      additionalProperties: true
    ResendSigningRequestResponse:
