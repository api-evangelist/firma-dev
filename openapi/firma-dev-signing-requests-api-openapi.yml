  /signing-requests/{id}/download:
    get:
      summary: Download Signing Request Document
      description: 'Retrieve a download URL for a signing request''s signed document. For completed signing requests, returns the final signed PDF. For in-progress signing requests where partial download is enabled, returns a URL to the partially-signed document generated at the time of the last signer''s completion.


        **Partial downloads:** Partial downloads are only available when the signing request has `allow_partial_download` enabled in settings. If the document has not been partially generated yet, a `503` is returned — retry after the `Retry-After` interval.


        **URL expiry:** The `download_url` is a pre-signed URL that expires. The expiry timestamp is provided in `expires_at`.'
      tags:
      - Signing Requests
      security:
      - ApiKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Signing request ID
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Download URL retrieved successfully.
          headers:
            X-RateLimit-Limit:
              schema:
                type: integer
              description: 'Rate limit: 200 requests per minute'
            X-RateLimit-Remaining:
              schema:
                type: integer
            X-RateLimit-Reset:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningRequestDownloadResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Signing request not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: not_found
        '409':
          description: Signing request has not been sent yet. Download is only available after the request has been sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: no_document_available
                message: Signing request has not been sent yet
        '429':
          $ref: '#/components/responses/RateLimitError'
        '503':
          description: Document generation is in progress. Retry after the indicated interval.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                generation_timeout:
                  summary: Document generation timed out
                  value:
                    error: generation_timeout
                stale_at_publication:
                  summary: Document was stale at publication time
                  value:
                    error: stale_at_publication
      operationId: downloadSigningRequest
      x-codeSamples:
      - lang: TypeScript
        label: '@firma-dev/sdk'
        source: "import { FirmaClient } from \"@firma-dev/sdk\";\n\nconst firma = new FirmaClient({ apiKey: \"YOUR_API_KEY\" });\n\nconst response = await firma.signingRequests.downloadSigningRequest({\n    id: \"id\"\n});\nconsole.log(response);"
  /signing-requests/{id}/signers/{signer_id}/signature:
    get:
      operationId: retrieveSignerSignature
      summary: Retrieve Signer Signature Image
      description: Retrieve a signer's adopted signature as a base64 PNG data URI, separate from the signed PDF. A signer adopts one signature applied to all their signature fields, so no field_id is needed. Drawn signatures return the captured image; typed signatures are rendered to PNG server-side. The `image` is a `data:image/png;base64,...` URI usable directly in an ``. By default a signer-ID frame is overlaid (`include_frame=false` to omit). Every successful retrieval is audit-logged. Rate limited to 60/min. Legal validity rests on the sealed PDF and completion certificate, not this image.
      tags:
      - Signing Requests
      security:
      - ApiKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Signing request ID
        schema:
          type: string
          format: uuid
      - name: signer_id
        in: path
        required: true
        description: Signer (recipient) ID — the recipient_id from GET /fields
        schema:
          type: string
          format: uuid
      - name: include_frame
        in: query
        required: false
        description: Overlay the signer-ID frame on the image (default true). Set to false for the bare mark.
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: The signer's mark as a base64 PNG data URI.
          content:
            application/json:
              schema:
                type: object
                properties:
                  signer_id:
                    type: string
                    format: uuid
                  kind:
                    type: string
                    enum:
                    - signature
                    - initials
                    - stamp
                  format:
                    type: string
                    example: png
                  framed:
                    type: boolean
                    description: Whether the signer-ID frame was overlaid.
                  image:
                    type: string
                    description: PNG as a data URI.
                    example: data:image/png;base64,iVBORw0KGgo...
        '401':
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
        '404':
