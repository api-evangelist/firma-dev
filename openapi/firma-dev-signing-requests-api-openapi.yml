      - cancelled_on
    SigningRequestSettings:
      type: object
      description: Settings returned by the signing request list and detail endpoints. Templates use the TemplateSettings schema (no identity fields).
      properties:
        allow_download:
          type: boolean
          description: Whether recipients can download the document
          default: true
        attach_pdf_on_finish:
          type: boolean
          description: Whether to attach PDF when signing is complete
          default: true
        allow_editing_before_sending:
          type: boolean
          description: Whether the signing request can be edited before sending
          default: false
        use_signing_order:
