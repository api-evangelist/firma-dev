      operationId: uploadDocument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - file_name
              - file_size
              - content_type
              properties:
                file_name:
                  type: string
                  maxLength: 255
                  description: Name of the document file
                  example: contract.pdf
                file_size:
                  type: integer
                  minimum: 1
                  maximum: 52428800
                  description: File size in bytes. Maximum 50MB (52,428,800 bytes).
                  example: 15000000
                content_type:
                  type: string
                  enum:
                  - application/pdf
                  - application/vnd.openxmlformats-officedocument.wordprocessingml.document
                  description: MIME type of the document
                  example: application/pdf
      responses:
        '201':
          description: Upload URL created
          content:
            application/json:
              schema:
                type: object
                properties:
                  document_id:
                    type: string
                    format: uuid
                    description: Document ID to pass in the signing request
                  upload_url:
                    type: string
                    format: uri
                    description: Presigned URL to PUT the document file to. Send the raw file bytes with Content-Type matching the requested content_type.
                  upload_token:
                    type: string
                    description: Upload authentication token (included in the upload_url)
                  expires_in:
                    type: integer
                    description: Seconds until the upload URL expires
                    example: 3600
        '400':
          description: Validation error (invalid file_size, content_type, etc.)
        '401':
          description: Invalid or missing API key
