availability: Webhook delivery needs both the per-webhook enabled flag and the company- or workspace-level master switch; POST /webhooks/{id}/test bypasses the master switch.
delivery:
  method: 'POST, Content-Type: application/json'
  timeout: Endpoint must use HTTPS and respond within 5 seconds.
  payload: '{id, type, created_at, company_id, workspace_id, data}'
signature:
  header: X-Firma-Signature
  format: t=<unix timestamp>,v1=<hex>
  algorithm: HMAC-SHA256
  signed_payload: '''{timestamp}.{json_body}'''
  rotation: X-Firma-Signature-Old carries the signature with the previous secret during a 7-day rotation grace period.
headers:
- X-Firma-Signature
- X-Firma-Signature-Old
- X-Firma-Event
- X-Firma-Delivery
