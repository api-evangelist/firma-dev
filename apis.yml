aid: firma-dev
name: Firma.dev
image: https://framerusercontent.com/assets/6BZ6uZhXFZ37plllWJaDRaNVyoo.png
description: Firma.dev provides a low‑cost electronic signature API aimed at developers, offering pay‑as‑you‑go pricing starting at €0.049 per
  envelope with no minimums or contracts. The platform is fully white‑labeled, compliant with ESIGN, UETA, eIDAS, and includes audit trails, SOC 2,
  GDPR, ISO 27001 certifications. It offers a simple REST API, Swagger/OpenAPI docs, webhook events, and sample apps, targeting quick integration
  for any language. Firma.dev also supplies a developer portal, pricing page, and extensive documentation for embedding e‑signatures directly
  into applications.
